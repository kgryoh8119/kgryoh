<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スムシティ</title>
<link rel="icon" href="data:,">
<script>
// 起動に失敗したとき（古いブラウザ・3D 表示が使えない など）、真っ白のままにせず理由を出す
(function () {
  function show(msg) {
    var box = document.getElementById('bootErr');
    if (!box) { box = document.createElement('div'); box.id = 'bootErr'; box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#7a1f17;color:#fff;font:13px/1.5 sans-serif;padding:10px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-all'; (document.body || document.documentElement).appendChild(box); box.textContent = 'スムシティを起動できませんでした。この画面を撮って送ってください。\n'; }
    box.textContent += '\n' + msg;
  }
  window.__sumuBootShow = show;
  // ResizeObserver の「通知が間に合わなかった」は害のない警告（画面の大きさが変わる途中で出る）なので出さない
  var benign = function (m) { return /ResizeObserver loop/.test(String(m || '')); };
  window.addEventListener('error', function (e) { if (benign(e.message)) { e.stopImmediatePropagation && e.stopImmediatePropagation(); return; } show(String(e.message || e.error || e) + (e.filename ? ' (' + String(e.filename).slice(-40) + ':' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason).slice(0, 400)); });
  var nm = !('noModule' in HTMLScriptElement.prototype);
  setTimeout(function () { if (!window.__sumuBoot) show((nm ? 'このブラウザは新しい JavaScript（モジュール）に対応していません。' : '起動が 15 秒たっても始まりません。') + '\n' + navigator.userAgent); }, 15000);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</head>
<body>
<!--APP-->
<div id="app">
  <div id="loading" role="status"><b>スムシティ</b><span>地図と街を準備しています…</span></div>
  <canvas id="gl" aria-label="街の 3D 地図"></canvas>
  <div id="labels"></div>
  <header id="top">
    <div class="plate" data-act="menu" role="button" tabindex="0" title="保存・タイトルへ戻る"><b>住野市</b><span>スムシティ・市長モード</span></div>
    <div id="chips"></div>
    <div id="clock"><div class="date" id="date"></div><div class="speed" id="speed" role="group" aria-label="時間の速さ"></div><button class="topbtn" id="unsaved" data-act="unsaved" hidden style="background:#b3261e;color:#fff;font-weight:700;width:auto;padding:0 10px">⚠ 未保存</button><button class="topbtn bellbtn" data-act="news" aria-label="お知らせ" title="お知らせ">🔔</button><button class="topbtn sndbtn" data-act="sound" aria-label="音のオン・オフ" title="音のオン・オフ">🔊</button><button class="topbtn viewbtn" data-act="viewtoggle" aria-label="地図の表示とカメラ">表示</button><button class="topbtn" data-act="menu" aria-label="保存・設定">保存・設定</button></div>
  </header>
  <nav id="tools" aria-label="道具"></nav>
  <div id="flyout" hidden></div>
  <div id="tutorial" hidden></div>
  <div id="hint" hidden role="status"></div>
  <aside id="side" aria-label="市長の資料"><div id="tabs" role="tablist"></div><div id="panel"></div></aside>
  <div id="viewbar"></div>
  <div id="info" hidden></div>
  <button id="undo" hidden data-act="undo" title="直前の操作を取り消す（Ctrl+Z）">↶ 取り消す</button>
  <div id="perf"></div>
  <div id="draftbar" hidden></div>
  <div id="photobar" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" hidden></div>
  <div id="tip" hidden></div>
</div>
<!--/APP-->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
